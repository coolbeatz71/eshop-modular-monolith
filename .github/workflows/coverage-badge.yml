name: Generate Coverage Badge

on:
  push:
    branches: [ main ]
  workflow_run:
    workflows: ["Perform Checks"]
    branches: [ main ]
    types:
      - completed

jobs:
  coverage-badge:
    name: Generate Coverage Badge
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        
    - name: Restore dependencies
      run: dotnet restore src/eshop-modular-monoliths.sln
      
    - name: Build solution
      run: dotnet build src/eshop-modular-monoliths.sln --configuration Release --no-restore
      
    - name: Run Tests with Coverage
      run: |
        dotnet test --configuration Release --no-build --verbosity normal \
          --collect:"XPlat Code Coverage" --settings coverlet.runsettings \
          --results-directory TestResults/
        
    - name: Generate Coverage Report
      run: |
        dotnet tool install -g dotnet-reportgenerator-globaltool
        reportgenerator \
          "-reports:TestResults/**/coverage.cobertura.xml" \
          "-targetdir:coverage-report" \
          "-reporttypes:Html;Cobertura;Badges;JsonSummary" \
          "-title:EShop Coverage Report"
        
    - name: Extract Coverage Percentage
      id: coverage
      run: |
        coverage=$(grep -o '"lineCoveragePercent":[^,]*' coverage-report/Summary.json | grep -o '[0-9.]*')
        echo "percentage=$coverage" >> $GITHUB_OUTPUT
        
        # Determine badge color
        if (( $(echo "$coverage >= 90" | bc -l) )); then
          echo "color=brightgreen" >> $GITHUB_OUTPUT
        elif (( $(echo "$coverage >= 80" | bc -l) )); then
          echo "color=green" >> $GITHUB_OUTPUT  
        elif (( $(echo "$coverage >= 70" | bc -l) )); then
          echo "color=yellow" >> $GITHUB_OUTPUT
        elif (( $(echo "$coverage >= 60" | bc -l) )); then
          echo "color=orange" >> $GITHUB_OUTPUT
        else
          echo "color=red" >> $GITHUB_OUTPUT
        fi
        
    - name: Create Coverage Badge
      uses: schneegans/dynamic-badges-action@v1.7.0
      with:
        auth: ${{ secrets.GIST_SECRET }}
        gistID: ${{ secrets.GIST_ID }}
        filename: eshop-coverage.json
        label: coverage
        message: ${{ steps.coverage.outputs.percentage }}%
        color: ${{ steps.coverage.outputs.color }}
        
    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage-report/