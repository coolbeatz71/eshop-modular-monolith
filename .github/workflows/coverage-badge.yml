name: Generate Coverage Badge

on:
  push:
    branches: [ main ]
  workflow_run:
    workflows: ["Perform Checks"]
    branches: [ main ]
    types:
      - completed

jobs:
  coverage-badge:
    name: Generate Coverage Badge
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        
    - name: Restore dependencies
      run: dotnet restore src/eshop-modular-monoliths.sln
      
    - name: Build solution
      run: dotnet build src/eshop-modular-monoliths.sln --configuration Release --no-restore
      
    - name: Run Tests with Coverage
      run: |
        dotnet test --configuration Release --no-build --verbosity normal \
          --collect:"XPlat Code Coverage" --settings coverlet.runsettings \
          --results-directory TestResults/ || echo "Some tests failed, but continuing with coverage report"
        
    - name: Generate Coverage Report
      run: |
        dotnet tool install -g dotnet-reportgenerator-globaltool
        reportgenerator \
          "-reports:TestResults/**/coverage.cobertura.xml" \
          "-targetdir:coverage-report" \
          "-reporttypes:Html;Cobertura;Badges;JsonSummary" \
          "-title:EShop Coverage Report"
        
    - name: Extract Coverage Percentage
      id: coverage
      run: |
        # Install bc for calculations
        sudo apt-get update && sudo apt-get install -y bc
        
        # Extract coverage percentage from JSON
        if [ -f "coverage-report/Summary.json" ]; then
          coverage=$(grep -o '"lineCoveragePercent":[0-9.]*' coverage-report/Summary.json | grep -o '[0-9.]*' | head -1)
          
          # Fallback to parsing Cobertura XML if JSON fails
          if [ -z "$coverage" ] && [ -f "coverage-report/Cobertura.xml" ]; then
            coverage=$(grep -o 'line-rate="[0-9.]*"' coverage-report/Cobertura.xml | head -1 | grep -o '[0-9.]*')
            coverage=$(echo "$coverage * 100" | bc -l | sed 's/\..*//')
          fi
        else
          coverage="0"
        fi
        
        # Set default if still empty
        if [ -z "$coverage" ]; then
          coverage="0"
        fi
        
        echo "Extracted coverage: $coverage%"
        echo "percentage=$coverage" >> $GITHUB_OUTPUT
        
        # Determine badge color using integer comparison
        if [ "$coverage" -ge 90 ]; then
          echo "color=brightgreen" >> $GITHUB_OUTPUT
        elif [ "$coverage" -ge 80 ]; then
          echo "color=green" >> $GITHUB_OUTPUT
        elif [ "$coverage" -ge 70 ]; then
          echo "color=yellow" >> $GITHUB_OUTPUT
        elif [ "$coverage" -ge 60 ]; then
          echo "color=orange" >> $GITHUB_OUTPUT
        else
          echo "color=red" >> $GITHUB_OUTPUT
        fi
        
    - name: Create Coverage Badge
      uses: schneegans/dynamic-badges-action@v1.7.0
      with:
        auth: ${{ secrets.GIST_SECRET }}
        gistID: ${{ secrets.GIST_ID }}
        filename: eshop-coverage.json
        label: coverage
        message: ${{ steps.coverage.outputs.percentage }}%
        color: ${{ steps.coverage.outputs.color }}
      continue-on-error: true
        
    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage-report/