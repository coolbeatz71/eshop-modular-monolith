name: Perform Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  build:
    name: Restore & Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        
    - name: Restore dependencies
      run: dotnet restore src/eshop-modular-monoliths.sln
      
    - name: Build solution
      run: dotnet build src/eshop-modular-monoliths.sln --configuration Release --no-restore