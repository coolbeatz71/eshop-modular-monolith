name: Perform Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  build:
    name: Restore & Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        
    - name: Restore dependencies
      run: dotnet restore src/eshop-modular-monoliths.sln
      
    - name: Build solution
      run: dotnet build src/eshop-modular-monoliths.sln --configuration Release --no-restore

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: eshop_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        
    - name: Restore dependencies
      run: dotnet restore src/eshop-modular-monoliths.sln
      
    - name: Build solution
      run: dotnet build src/eshop-modular-monoliths.sln --configuration Release --no-restore
      
    - name: Run Unit Tests - TestHelpers
      run: dotnet test tests/TestHelpers/TestHelpers.csproj --configuration Release --no-build --verbosity normal --logger trx --results-directory TestResults/
      
    - name: Run Unit Tests - Basket
      run: dotnet test tests/UnitTests/Basket/Basket.UnitTests.csproj --configuration Release --no-build --verbosity normal --logger trx --results-directory TestResults/
      
    - name: Run Unit Tests - Catalog
      run: dotnet test tests/UnitTests/Catalog/Catalog.UnitTests.csproj --configuration Release --no-build --verbosity normal --logger trx --results-directory TestResults/
      
    - name: Run Unit Tests - Ordering
      run: dotnet test tests/UnitTests/Ordering/Ordering.UnitTests.csproj --configuration Release --no-build --verbosity normal --logger trx --results-directory TestResults/
      
    - name: Run Unit Tests - Shared
      run: dotnet test tests/UnitTests/Shared/Shared.UnitTests.csproj --configuration Release --no-build --verbosity normal --logger trx --results-directory TestResults/
      
    - name: Run Integration Tests - API
      run: dotnet test tests/IntegrationTests/Api/Api.IntegrationTests.csproj --configuration Release --no-build --verbosity normal --logger trx --results-directory TestResults/
      env:
        ASPNETCORE_ENVIRONMENT: Testing
        ConnectionStrings__DefaultConnection: ${{ secrets.TEST_DATABASE_CONNECTION_STRING }}
        ConnectionStrings__Redis: ${{ secrets.TEST_REDIS_CONNECTION_STRING }}
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: TestResults/