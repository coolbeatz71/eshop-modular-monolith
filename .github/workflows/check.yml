name: Perform Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  build:
    name: Restore & Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        
    - name: Restore dependencies
      run: dotnet restore src/eshop-modular-monoliths.sln
      
    - name: Build solution
      run: dotnet build src/eshop-modular-monoliths.sln --configuration Release --no-restore

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        
    - name: Setup Docker for TestContainers
      run: |
        # Ensure Docker daemon is running and accessible
        docker --version
        docker info
        
    - name: Restore dependencies
      run: dotnet restore src/eshop-modular-monoliths.sln
      
    - name: Build solution
      run: dotnet build src/eshop-modular-monoliths.sln --configuration Release --no-restore
      
    - name: Run Unit Tests with Coverage - TestHelpers
      run: dotnet test tests/TestHelpers/TestHelpers.csproj --configuration Release --no-build --verbosity normal --logger trx --results-directory TestResults/ --collect:"XPlat Code Coverage" --settings coverlet.runsettings
      
    - name: Run Unit Tests with Coverage - Basket
      run: dotnet test tests/UnitTests/Basket/Basket.UnitTests.csproj --configuration Release --no-build --verbosity normal --logger trx --results-directory TestResults/ --collect:"XPlat Code Coverage" --settings coverlet.runsettings
      
    - name: Run Unit Tests with Coverage - Catalog
      run: dotnet test tests/UnitTests/Catalog/Catalog.UnitTests.csproj --configuration Release --no-build --verbosity normal --logger trx --results-directory TestResults/ --collect:"XPlat Code Coverage" --settings coverlet.runsettings
      
    - name: Run Unit Tests with Coverage - Ordering
      run: dotnet test tests/UnitTests/Ordering/Ordering.UnitTests.csproj --configuration Release --no-build --verbosity normal --logger trx --results-directory TestResults/ --collect:"XPlat Code Coverage" --settings coverlet.runsettings
      
    - name: Run Unit Tests with Coverage - Shared
      run: dotnet test tests/UnitTests/Shared/Shared.UnitTests.csproj --configuration Release --no-build --verbosity normal --logger trx --results-directory TestResults/ --collect:"XPlat Code Coverage" --settings coverlet.runsettings
      
    - name: Run Integration Tests with Coverage - API
      run: dotnet test tests/IntegrationTests/Api/Api.IntegrationTests.csproj --configuration Release --no-build --verbosity normal --logger trx --results-directory TestResults/ --collect:"XPlat Code Coverage" --settings coverlet.runsettings
      env:
        ASPNETCORE_ENVIRONMENT: Testing
        # TestContainers will manage database and Redis containers
        
    - name: Merge Coverage Reports
      run: |
        dotnet tool install -g dotnet-reportgenerator-globaltool
        reportgenerator "-reports:TestResults/**/coverage.cobertura.xml" "-targetdir:TestResults/CoverageReport" "-reporttypes:Html;Cobertura;Badges" "-title:EShop Coverage Report"
        
    - name: Generate Coverage Summary
      run: |
        echo "## 📊 Code Coverage Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        coverage_percent=$(grep -o 'line-rate="[^"]*"' TestResults/CoverageReport/Cobertura.xml | head -1 | grep -o '[0-9.]*' | awk '{printf "%.1f", $1*100}')
        echo "**Overall Coverage:** ${coverage_percent}%" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📈 Detailed coverage report available in artifacts" >> $GITHUB_STEP_SUMMARY
        
    - name: Upload Coverage Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-reports
        path: TestResults/CoverageReport/
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: TestResults/